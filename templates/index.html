<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Public projects by HagantaRG.">
    <title>HagantaRG — Projects</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }

      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      header {
        margin-bottom: 3rem;
      }

      h1,
      h2 {
        margin-bottom: 0.25rem;
      }

      header p,
      section > p {
        margin-top: 0;
        color: CanvasText;
        opacity: 0.7;
      }

      ul {
        padding: 0;
        list-style: none;
      }

      li {
        padding: 1rem 0;
        border-top: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      }

      li:last-child {
        border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      }

      .project-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }

      .project-heading a {
        color: LinkText;
        font-weight: 600;
        text-decoration: none;
      }

      .project-heading a:hover,
      .project-heading a:focus-visible,
      .description a:hover,
      .description a:focus-visible {
        text-decoration: underline;
      }

      .languages {
        color: CanvasText;
        font-size: 0.875rem;
        opacity: 0.65;
      }

      .description p {
        margin: 0.5rem 0 0;
      }

      section + section,
      footer {
        margin-top: 3rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Projects</h1>
      <p>Public work by HagantaRG.</p>
    </header>

    <main aria-label="Public GitHub projects">
      <section aria-labelledby="current-projects">
        <h2 id="current-projects">Current</h2>
        <ul>
{{ current_projects }}
        </ul>
      </section>

      <section aria-labelledby="archive">
        <h2 id="archive">Archive</h2>
        <p>Projects I no longer work on or have since replaced.</p>
        <ul>
{{ archive_projects }}
        </ul>
      </section>
    </main>

    <footer>
      <a href="https://github.com/HagantaRG">GitHub</a>
      ·
      <a href="https://www.linkedin.com/in/haganta-ramyakim-ginting-53007688/">LinkedIn</a>
    </footer>
  </body>
</html>
